name: Verify one platform
on:
  workflow_call:
    inputs:
      prepared:
        type: string
        required: true
      os:
        type: string
        required: true
      groups:
        type: string
        required: true
      base:
        type: string
        default: ''
permissions:
  contents: read
env:
  KSF_SKIP_AUTO_UPDATE: '1'
  KSF_TEST_BASE: ${{ inputs.base }}
jobs:
  prepare:
    name: Prepare ${{ inputs.prepared }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - name: Prepare and verify pinned runtime on macOS
        if: runner.os == 'macOS'
        run: |
          .agents/ksf build --json > /dev/null
          .agents/ksf runtime verify --json
          ksf_node=$(.agents/ksf hello --json | /usr/bin/plutil -extract runtime.nodePath raw -o - -)
          dirname "$ksf_node" >> "$GITHUB_PATH"
      - name: Prepare and verify pinned runtime on Linux
        if: runner.os == 'Linux'
        run: |
          .agents/ksf build --json > /dev/null
          .agents/ksf runtime verify --json
          ksf_node=$(.agents/ksf hello --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["runtime"]["nodePath"])')
          dirname "$ksf_node" >> "$GITHUB_PATH"
      - name: Prepare and verify pinned runtime on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & ./.agents/ksf.ps1 build --json | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./.agents/ksf.ps1 runtime verify --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $details = & ./.agents/ksf.ps1 hello --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Split-Path $details.runtime.nodePath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install locked platform dependencies
        run: |
          npm --prefix .agents/core/applications/sdk ci --ignore-scripts > sdk.install.log 2>&1 & ksf_sdk_pid=$!
          npm --prefix .agents/core/runtime/web ci > web.install.log 2>&1 & ksf_web_pid=$!
          npm --prefix .agents/core/applications/projects ci --ignore-scripts > projects.install.log 2>&1 & ksf_projects_pid=$!
          ksf_install_status=0
          for ksf_pid in "$ksf_sdk_pid" "$ksf_web_pid" "$ksf_projects_pid"; do
            wait "$ksf_pid" || ksf_install_status=$?
          done
          cat sdk.install.log web.install.log projects.install.log
          exit "$ksf_install_status"
      - name: Build frontend before server tests
        working-directory: .agents/core/runtime/web
        run: npm run build
      - name: Freeze prepared toolchains
        run: tar -cf prepared.tar .agents/core/applications/sdk/node_modules .agents/core/applications/projects/node_modules .agents/core/runtime/web/node_modules .agents/core/runtime/web/dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          overwrite: true
          name: prepared-${{ inputs.prepared }}
          path: prepared.tar
          retention-days: 1
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          overwrite: true
          name: failure-platform-${{ inputs.prepared }}-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            *.report.json
            .agents/runtime-data/tests/
  tests:
    name: ${{ matrix.id }} (${{ matrix.profile }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.groups) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.2
        with:
          name: verification-plan
      - uses: actions/download-artifact@v8.0.2
        with:
          name: prepared-${{ matrix.prepared }}
      - name: Restore platform toolchains
        run: tar -xf prepared.tar
      - name: Prepare group runtime on macOS
        if: runner.os == 'macOS'
        run: |
          .agents/ksf build --json > /dev/null
          ksf_node=$(.agents/ksf hello --json | /usr/bin/plutil -extract runtime.nodePath raw -o - -)
          dirname "$ksf_node" >> "$GITHUB_PATH"
      - name: Prepare group runtime on Linux
        if: runner.os == 'Linux'
        run: |
          .agents/ksf build --json > /dev/null
          ksf_node=$(.agents/ksf hello --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["runtime"]["nodePath"])')
          dirname "$ksf_node" >> "$GITHUB_PATH"
      - name: Prepare group runtime on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & ./.agents/ksf.ps1 build --json | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $details = & ./.agents/ksf.ps1 hello --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Split-Path $details.runtime.nodePath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Restore declared local SDK links
        run: node .agents/core/runtime/src/testing/ci.js restore-links
      - name: Exact planned group
        id: tests
        run: node .agents/core/runtime/src/testing/ci.js run-group verification-plan.json "${{ matrix.id }}" "${{ matrix.id }}.report.json"
      - uses: actions/upload-artifact@v7.0.2
        if: always() && steps.tests.outcome != 'skipped'
        with:
          overwrite: true
          name: group-${{ matrix.id }}
          path: '*.report.json'
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          overwrite: true
          name: failure-${{ matrix.id }}-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            *.report.json
            .agents/runtime-data/tests/
