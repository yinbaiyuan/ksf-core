name: Verify Core
on:
  push:
    branches: [core-main]
  pull_request:
    branches: [core-main]
  workflow_dispatch:
    inputs:
      full:
        description: Run complete shared and native verification
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: verify-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verification:
    if: github.repository == 'yinbaiyuan/ksf-core'
    uses: ./.github/workflows/verification.yml
    with:
      full: ${{ github.event_name == 'push' || inputs.full == true || (github.event_name != 'pull_request' && !github.event.before) || github.event.before == '0000000000000000000000000000000000000000' }}
      base: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
  required:
    if: always() && github.repository == 'yinbaiyuan/ksf-core'
    needs: verification
    runs-on: ubuntu-24.04
    steps:
      - env:
          VERIFICATION: ${{ needs.verification.result }}
        run: test "$VERIFICATION" = success
