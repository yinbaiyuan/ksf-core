name: Verify Core
on:
  push:
    branches: [core-main]
  pull_request:
    branches: [core-main]
  workflow_dispatch:
    inputs:
      full:
        description: Run complete shared and native verification
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: verify-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  reuse:
    if: github.repository == 'yinbaiyuan/ksf-core' && github.event_name != 'pull_request'
    uses: ./.github/workflows/proof.yml
  verification:
    needs: reuse
    if: ${{ !cancelled() && github.repository == 'yinbaiyuan/ksf-core' && needs.reuse.outputs.valid != 'true' }}
    uses: ./.github/workflows/verification.yml
    with:
      full: ${{ github.event_name != 'workflow_dispatch' || inputs.full == true }}
      base: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
  required:
    if: always() && github.repository == 'yinbaiyuan/ksf-core'
    needs: [reuse, verification]
    runs-on: ubuntu-24.04
    steps:
      - env:
          REUSED: ${{ needs.reuse.outputs.valid }}
          REUSE_RESULT: ${{ needs.reuse.result }}
          VERIFICATION: ${{ needs.verification.result }}
        run: test "$VERIFICATION" = success || { test "$REUSE_RESULT" = success && test "$REUSED" = true; }
