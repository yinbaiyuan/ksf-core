name: Verify reusable complete CI proof
on:
  workflow_call:
    outputs:
      valid:
        value: ${{ jobs.proof.outputs.valid }}
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  proof:
    if: github.repository == 'yinbaiyuan/ksf-core'
    runs-on: ubuntu-24.04
    outputs:
      valid: ${{ steps.verify.outputs.valid }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Prepare bundled Node
        run: |
          .agents/ksf build --json > /dev/null
          ksf_node=$(.agents/ksf hello --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["runtime"]["nodePath"])')
          dirname "$ksf_node" >> "$GITHUB_PATH"
      - id: find
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .agents/core/runtime/src/testing/ci.js find-proof
      - uses: actions/download-artifact@v8.0.2
        if: steps.find.outputs.candidate != ''
        continue-on-error: true
        with:
          artifact-ids: ${{ steps.find.outputs.candidate }}
          run-id: ${{ steps.find.outputs.run }}
          github-token: ${{ github.token }}
          path: trusted-proof
      - id: verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KSF_PROOF_RUN: ${{ steps.find.outputs.run }}
        run: node .agents/core/runtime/src/testing/ci.js verify-proof trusted-proof/proof.json "$KSF_PROOF_RUN"
