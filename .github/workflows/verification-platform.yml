name: Verify one platform
on:
  workflow_call:
    inputs:
      prepared:
        type: string
        required: true
      os:
        type: string
        required: true
      groups:
        type: string
        required: true
      base:
        type: string
        default: ''
      toolchains:
        type: boolean
        default: true
      prepared_external:
        type: boolean
        default: false
      full:
        type: boolean
        default: false
permissions:
  contents: read
env:
  KSF_SKIP_AUTO_UPDATE: '1'
  KSF_TEST_BASE: ${{ inputs.base }}
jobs:
  prepare:
    if: ${{ !inputs.prepared_external }}
    uses: ./.github/workflows/verification-prepare.yml
    with:
      os: ${{ inputs.os }}
      prepared: ${{ inputs.prepared }}
      groups: ${{ inputs.groups }}
      base: ${{ inputs.base }}
      toolchains: ${{ inputs.toolchains }}
      full: ${{ inputs.full }}
  tests:
    name: ${{ matrix.id }} (${{ matrix.profile }})
    needs: prepare
    if: ${{ !cancelled() && (inputs.prepared_external || needs.prepare.result == 'success') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.groups) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: ${{ inputs.full && 1 || 0 }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: verification-plan
      - uses: actions/download-artifact@v8.0.2
        with:
          name: prepared-${{ matrix.prepared }}
      - name: Prepare group runtime on macOS
        if: runner.os == 'macOS'
        run: |
          .agents/ksf build --json > /dev/null
          ksf_node=$(.agents/ksf hello --json | /usr/bin/plutil -extract runtime.nodePath raw -o - -)
          dirname "$ksf_node" >> "$GITHUB_PATH"
      - name: Prepare group runtime on Linux
        if: runner.os == 'Linux'
        run: |
          .agents/ksf build --json > /dev/null
          ksf_node=$(.agents/ksf hello --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["runtime"]["nodePath"])')
          dirname "$ksf_node" >> "$GITHUB_PATH"
      - name: Prepare group runtime on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & ./.agents/ksf.ps1 build --json | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $details = & ./.agents/ksf.ps1 hello --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Split-Path $details.runtime.nodePath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Restore platform toolchains
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            node .agents/core/runtime/src/testing/prepared-archive.js decompress prepared.tar.zst prepared.tar
            tar -xf prepared.tar
          else
            node .agents/core/runtime/src/testing/prepared-archive.js decompress prepared.tar.zst - | tar -xf -
          fi
      - name: Restore declared local SDK links
        if: inputs.toolchains
        run: node .agents/core/runtime/src/testing/ci.js restore-links
      - name: Exact planned group
        id: tests
        env:
          KSF_TEST_CI_PREPARED_SEEDS: .agents/runtime-data/ci-seeds
          KSF_TEST_CI_CHECKOUT_SCRATCH: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: node .agents/core/runtime/src/testing/ci.js run-group verification-plan.json "${{ matrix.id }}" "${{ matrix.id }}.report.json"
      - uses: actions/upload-artifact@v7.0.2
        if: always() && steps.tests.outcome != 'skipped'
        with:
          overwrite: true
          name: group-${{ matrix.id }}
          path: '*.report.json'
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          overwrite: true
          name: failure-${{ matrix.id }}-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            *.report.json
            .agents/runtime-data/tests/
