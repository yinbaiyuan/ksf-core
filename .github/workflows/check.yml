name: Verify Core
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows-launcher:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify launcher with Windows PowerShell 5.1
        shell: powershell
        run: ./.agents/core/runtime/tests/launcher-windows.ps1
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            shard: 1/1
          - os: windows-2025
            shard: 1/4
          - os: windows-2025
            shard: 2/4
          - os: windows-2025
            shard: 3/4
          - os: windows-2025
            shard: 4/4
    runs-on: ${{ matrix.os }}
    # Native Windows transaction fixtures verify and copy the complete Core.
    # Keep their full batch budget separate from the bounded smoke/exit checks.
    timeout-minutes: ${{ matrix.os == 'windows-2025' && 180 || 90 }}
    env:
      KSF_SKIP_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Prepare bundled Node on macOS
        if: runner.os == 'macOS'
        run: |
          ./.agents/ksf build --json > /dev/null
          NODE_PATH="$(./.agents/ksf hello --json | /usr/bin/python3 -c 'import json,sys;print(json.load(sys.stdin)["runtime"]["nodePath"])')"
          dirname "$NODE_PATH" >> "$GITHUB_PATH"
      - name: Prepare bundled Node on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & .\.agents\ksf.ps1 build --json | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $details = & .\.agents\ksf.ps1 hello --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Split-Path $details.runtime.nodePath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & .\.agents\core\runtime\tests\bootstrap-windows.ps1 -Root $PWD.Path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install SDK test dependencies
        working-directory: .agents/core/applications/sdk
        run: npm ci --ignore-scripts
      - name: Install frontend dependencies
        working-directory: .agents/core/runtime/web
        run: npm ci
      - name: Verify shipped runtime on macOS
        if: runner.os == 'macOS'
        run: ./.agents/ksf runtime verify --json
      - name: Verify shipped runtime on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & .\.agents\ksf.ps1 runtime verify --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: SDK tests
        working-directory: .agents/core/applications/sdk
        run: npm test
      - name: Frontend tests
        working-directory: .agents/core/runtime/web
        run: npm test
      - name: Frontend build
        working-directory: .agents/core/runtime/web
        run: npm run build
      - name: Core platform smoke
        working-directory: .agents/core/runtime
        timeout-minutes: 3
        env:
          NODE_OPTIONS: '--test-reporter=tap --test-timeout=120000 --test-name-pattern="KSF_PLATFORM_SMOKE|UTF-8 PAX archives|distributed Terminal|ConPTY output EOF|terminal release waits|build derives package|real ksf build|KSF worktrees|managed creation|real deployed CLI|real launcher runs the full project lifecycle|identity migration preserves|interruption after identity|coordinated package/index|interrupted backup preparation|partial backup is retained|collisions, changed data|identity edits and inheritance|remote editing preserves|external changes and config lock|existing worktree configuration|remote validation, stale|configuration writes share|settings HTTP contract|simultaneous retries of one request|rename and removal retain|history filters the entire|commit details use|branch create supports|push can establish|stash removes|unstaging a rename|conflict resolution handles|HEAD history on an unborn"'
        run: node src/cli.js test
      - name: Core regression
        working-directory: .agents/core/runtime
        env:
          NODE_OPTIONS: --test-reporter=tap --test-shard=${{ matrix.shard }}
        run: node src/cli.js test
      - name: Verify clean release build
        run: node .agents/core/runtime/src/cli.js release build --dry-run --json
