name: Verify Core
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify launcher with Windows PowerShell 5.1 (no Node)
        shell: powershell
        run: ./.agents/core/runtime/tests/launcher-windows.ps1
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Verify shipped runtime
        run: .agents/ksf runtime verify --json
      - name: Run JavaScript tests with bundled Node
        run: .agents/ksf test
      - name: Verify clean release build
        run: .agents/ksf release build --dry-run --json
