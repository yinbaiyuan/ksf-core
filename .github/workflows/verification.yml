name: Shared and native verification
on:
  workflow_call:
    inputs:
      full:
        type: boolean
        required: true
      base:
        type: string
        default: ''
permissions:
  contents: read
env:
  KSF_SKIP_AUTO_UPDATE: '1'
  KSF_TEST_BASE: ${{ inputs.base }}
jobs:
  plan:
    if: github.repository == 'yinbaiyuan/ksf-core'
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.plan.outputs.full }}
      has_native: ${{ steps.plan.outputs.has_native }}
      has_linux: ${{ steps.plan.outputs.has_linux }}
      matrix: ${{ steps.plan.outputs.matrix }}
      preparations: ${{ steps.plan.outputs.preparations }}
      linux: ${{ steps.plan.outputs.linux }}
      prepared_groups: ${{ steps.plan.outputs.prepared_groups }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Prepare pinned plan runtime
        run: |
          .agents/ksf build --json > /dev/null
          ksf_node=$(.agents/ksf hello --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["runtime"]["nodePath"])')
          dirname "$ksf_node" >> "$GITHUB_PATH"
      - name: Install locked coverage-audit parser
        working-directory: .agents/core/applications/sdk
        run: npm ci --prefer-offline --ignore-scripts
      - id: plan
        env:
          KSF_MANUAL_FULL: ${{ inputs.full }}
        run: node .agents/core/runtime/src/testing/ci.js plan "$KSF_TEST_BASE"
      - uses: actions/upload-artifact@v7.0.2
        with:
          overwrite: true
          name: verification-plan
          path: |
            verification-plan.json
            coverage-audit.json
          if-no-files-found: error
  prepare-shared-linux:
    if: inputs.full && github.repository == 'yinbaiyuan/ksf-core'
    uses: ./.github/workflows/verification-prepare.yml
    with:
      os: ubuntu-24.04
      prepared: Linux
      toolchains: true
      full: true
  full-shared-linux:
    if: inputs.full && needs.plan.outputs.has_native == 'true'
    needs: [plan, prepare-shared-linux]
    uses: ./.github/workflows/verification-platform.yml
    with:
      os: ubuntu-24.04
      prepared: Linux
      groups: ${{ fromJSON(needs.plan.outputs.prepared_groups)['Linux'] }}
      base: ${{ inputs.base }}
      toolchains: true
      full: true
      prepared_external: true
  prepare-mac-runtime:
    if: inputs.full && github.repository == 'yinbaiyuan/ksf-core'
    uses: ./.github/workflows/verification-prepare.yml
    with:
      os: xcode-27
      prepared: macOS-runtime
      toolchains: false
      full: true
  full-mac-runtime:
    if: inputs.full && needs.plan.outputs.has_native == 'true'
    needs: [plan, prepare-mac-runtime]
    uses: ./.github/workflows/verification-platform.yml
    with:
      os: xcode-27
      prepared: macOS-runtime
      groups: ${{ fromJSON(needs.plan.outputs.prepared_groups)['macOS-runtime'] }}
      base: ${{ inputs.base }}
      toolchains: false
      full: true
      prepared_external: true
  prepare-mac:
    if: inputs.full && github.repository == 'yinbaiyuan/ksf-core'
    uses: ./.github/workflows/verification-prepare.yml
    with:
      os: xcode-27
      prepared: macOS
      toolchains: true
      full: true
  full-mac:
    if: inputs.full && needs.plan.outputs.has_native == 'true'
    needs: [plan, prepare-mac]
    uses: ./.github/workflows/verification-platform.yml
    with:
      os: xcode-27
      prepared: macOS
      groups: ${{ fromJSON(needs.plan.outputs.prepared_groups)['macOS'] }}
      base: ${{ inputs.base }}
      toolchains: true
      full: true
      prepared_external: true
  prepare-win-runtime:
    if: inputs.full && github.repository == 'yinbaiyuan/ksf-core'
    uses: ./.github/workflows/verification-prepare.yml
    with:
      os: windows-2025
      prepared: Windows-runtime
      toolchains: false
      full: true
  full-win-runtime:
    if: inputs.full && needs.plan.outputs.has_native == 'true'
    needs: [plan, prepare-win-runtime]
    uses: ./.github/workflows/verification-platform.yml
    with:
      os: windows-2025
      prepared: Windows-runtime
      groups: ${{ fromJSON(needs.plan.outputs.prepared_groups)['Windows-runtime'] }}
      base: ${{ inputs.base }}
      toolchains: false
      full: true
      prepared_external: true
  prepare-win:
    if: inputs.full && github.repository == 'yinbaiyuan/ksf-core'
    uses: ./.github/workflows/verification-prepare.yml
    with:
      os: windows-2025
      prepared: Windows
      toolchains: true
      full: true
  full-win:
    if: inputs.full && needs.plan.outputs.has_native == 'true'
    needs: [plan, prepare-win]
    uses: ./.github/workflows/verification-platform.yml
    with:
      os: windows-2025
      prepared: Windows
      groups: ${{ fromJSON(needs.plan.outputs.prepared_groups)['Windows'] }}
      base: ${{ inputs.base }}
      toolchains: true
      full: true
      prepared_external: true
  platform:
    name: ${{ matrix.prepared }}
    if: ${{ !inputs.full && needs.plan.outputs.has_native == 'true' }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.preparations) }}
    uses: ./.github/workflows/verification-platform.yml
    with:
      os: ${{ matrix.os }}
      prepared: ${{ matrix.prepared }}
      groups: ${{ matrix.groups }}
      base: ${{ inputs.base }}
      toolchains: ${{ matrix.toolchains }}
      full: ${{ needs.plan.outputs.full == 'true' }}
  linux-core:
    name: ${{ matrix.id }} (native Linux Core)
    if: needs.plan.outputs.has_linux == 'true'
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.linux) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: ${{ needs.plan.outputs.full == 'true' && 1 || 0 }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: verification-plan
      - name: Verify Linux bundled runtime and build inputs
        run: |
          .agents/ksf build --json > /dev/null
          .agents/ksf runtime verify --json
          .agents/ksf context entry --json > /dev/null
          ksf_node=$(.agents/ksf hello --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["runtime"]["nodePath"])')
          dirname "$ksf_node" >> "$GITHUB_PATH"
      - name: Install locked SDK build dependencies for Core app lifecycle
        working-directory: .agents/core/applications/sdk
        run: npm ci --prefer-offline --ignore-scripts
      - name: Exact planned Linux core group
        id: tests
        run: node .agents/core/runtime/src/testing/ci.js run-group verification-plan.json "${{ matrix.id }}" "${{ matrix.id }}.report.json"
      - uses: actions/upload-artifact@v7.0.2
        if: always() && steps.tests.outcome != 'skipped'
        with:
          overwrite: true
          name: group-${{ matrix.id }}
          path: '*.report.json'
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          overwrite: true
          name: failure-${{ matrix.id }}-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            *.report.json
            .agents/runtime-data/tests/
  coverage:
    if: always() && github.repository == 'yinbaiyuan/ksf-core'
    needs: [plan, platform, linux-core, full-shared-linux, full-mac-runtime, full-mac, full-win-runtime, full-win]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: ${{ needs.plan.outputs.full == 'true' && 1 || 0 }}
      - name: Preserve incomplete-plan diagnostics
        run: echo '{"schemaVersion":2,"complete":false,"error":"Plan or report download incomplete"}' > coverage.json
      - uses: actions/download-artifact@v8.0.2
        with:
          name: verification-plan
      - uses: actions/download-artifact@v8.0.2
        continue-on-error: true
        with:
          pattern: group-*
          path: reports
      - name: Verify exact shared and native coverage
        run: |
          .agents/ksf build --json > /dev/null
          ksf_node=$(.agents/ksf hello --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["runtime"]["nodePath"])')
          "$ksf_node" .agents/core/runtime/src/testing/ci.js aggregate-plan reports verification-plan.json proof.json
      - name: Require every applicable job
        if: always()
        env:
          KSF_FULL: ${{ needs.plan.outputs.full }}
          PLAN: ${{ needs.plan.result }}
          KSF_SHARED_LINUX_RESULT: ${{ needs.full-shared-linux.result }}
          KSF_MAC_RUNTIME_RESULT: ${{ needs.full-mac-runtime.result }}
          KSF_MAC_RESULT: ${{ needs.full-mac.result }}
          KSF_WIN_RUNTIME_RESULT: ${{ needs.full-win-runtime.result }}
          KSF_WIN_RESULT: ${{ needs.full-win.result }}
          PLATFORM: ${{ needs.platform.result }}
          LINUX: ${{ needs.linux-core.result }}
          HAS_NATIVE: ${{ needs.plan.outputs.has_native }}
          HAS_LINUX: ${{ needs.plan.outputs.has_linux }}
        run: |
          test "$PLAN" = success
          if [ "$HAS_NATIVE" = true ]; then
            if [ "$KSF_FULL" = true ]; then
              for ksf_result in "$KSF_SHARED_LINUX_RESULT" "$KSF_MAC_RUNTIME_RESULT" "$KSF_MAC_RESULT" "$KSF_WIN_RUNTIME_RESULT" "$KSF_WIN_RESULT"; do test "$ksf_result" = success || exit 1; done
            else
              test "$PLATFORM" = success
            fi
          fi
          if [ "$HAS_LINUX" = true ]; then test "$LINUX" = success; fi
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          overwrite: true
          name: coverage-${{ github.sha }}
          path: coverage.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: success() && needs.plan.outputs.full == 'true'
        with:
          overwrite: true
          name: suite-proof-${{ github.sha }}
          path: proof.json
          if-no-files-found: error
