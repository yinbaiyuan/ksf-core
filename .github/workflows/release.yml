name: Publish ksf-core Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ksf-release
  cancel-in-progress: false
jobs:
  find-proof:
    if: github.repository == 'yinbaiyuan/ksf-core'
    runs-on: macos-15
    outputs:
      valid: ${{ steps.verify.outputs.valid }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Prepare bundled Node
        run: |
          .agents/ksf build --json > /dev/null
          ksf_node=$(.agents/ksf hello --json | /usr/bin/plutil -extract runtime.nodePath raw -o - -)
          dirname "$ksf_node" >> "$GITHUB_PATH"
      - id: find
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .agents/core/runtime/src/testing/ci.js find-proof
      - uses: actions/download-artifact@v8.0.2
        if: steps.find.outputs.candidate != ''
        continue-on-error: true
        with:
          artifact-ids: ${{ steps.find.outputs.candidate }}
          run-id: ${{ steps.find.outputs.run }}
          github-token: ${{ github.token }}
          path: trusted-proof
      - id: verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KSF_PROOF_RUN: ${{ steps.find.outputs.run }}
        run: node .agents/core/runtime/src/testing/ci.js verify-proof trusted-proof/proof.json "$KSF_PROOF_RUN"
  verification:
    needs: find-proof
    if: github.repository == 'yinbaiyuan/ksf-core' && needs.find-proof.outputs.valid != 'true'
    uses: ./.github/workflows/verification.yml
    with:
      full: true
  prepare:
    needs: [find-proof, verification]
    if: ${{ !cancelled() && github.repository == 'yinbaiyuan/ksf-core' && (needs.find-proof.outputs.valid == 'true' || needs.verification.result == 'success') }}
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      version: ${{ steps.bundle.outputs.version }}
      revision: ${{ steps.bundle.outputs.revision }}
      index: ${{ steps.bundle.outputs.index_sha256 }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source and prepare bundled runtime
        env:
          KSF_RELEASE_DIRECTORY: ${{ runner.temp }}/ksf-release
          KSF_REF_TYPE: ${{ github.ref_type }}
          KSF_REF_NAME: ${{ github.ref_name }}
        run: |
          ksf_version=$(/usr/bin/plutil -extract version raw -o - .agents/core/build.json)
          if [ "$KSF_REF_TYPE" = tag ]; then test "$KSF_REF_NAME" = "v$ksf_version"; fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/core-main
          .agents/ksf build --json > /dev/null
          .agents/ksf runtime verify --json
          ksf_node=$(.agents/ksf hello --json | /usr/bin/plutil -extract runtime.nodePath raw -o - -)
          printf 'KSF_RELEASE_NODE=%s\n' "$ksf_node" >> "$GITHUB_ENV"
          dirname "$ksf_node" >> "$GITHUB_PATH"
      - name: Install SDK test dependencies
        working-directory: .agents/core/applications/sdk
        run: npm ci --ignore-scripts
      - name: Install frontend dependencies
        working-directory: .agents/core/runtime/web
        run: npm ci
      - name: Build frontend for the final artifact
        working-directory: .agents/core/runtime/web
        run: npm run build
      - name: Build the single Core bundle
        id: bundle
        env:
          KSF_RELEASE_DIRECTORY: ${{ runner.temp }}/ksf-release
          KSF_EXPECTED_REVISION: ${{ github.sha }}
          KSF_GITHUB_TOKEN: ${{ github.token }}
        run: |
          .agents/ksf release build --output "$KSF_RELEASE_DIRECTORY" --json
          "$KSF_RELEASE_NODE" .agents/core/runtime/src/distribution/release-actions.js inspect
      - name: Verify official Core template settings
        env:
          KSF_GITHUB_TOKEN: ${{ github.token }}
        run: '"$KSF_RELEASE_NODE" .agents/core/runtime/src/distribution/release-actions.js preflight'
      - uses: actions/upload-artifact@v7.0.2
        id: upload
        with:
          name: ksf-core-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ksf-release/*.tar.gz
            ${{ runner.temp }}/ksf-release/*.json
          if-no-files-found: error
          retention-days: 14
  release:
    needs: prepare
    if: ${{ !cancelled() && github.repository == 'yinbaiyuan/ksf-core' && needs.prepare.result == 'success' }}
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      KSF_EXPECTED_REVISION: ${{ needs.prepare.outputs.revision }}
      KSF_EXPECTED_INDEX: ${{ needs.prepare.outputs.index }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact }}
          path: ${{ runner.temp }}/ksf-release
          merge-multiple: true
      - name: Verify frozen handoff and publish only Core
        env:
          KSF_GITHUB_TOKEN: ${{ github.token }}
          KSF_RELEASE_DIRECTORY: ${{ runner.temp }}/ksf-release
          KSF_RELEASE_PHASE: core
          KSF_RELEASE_RESULT: ${{ runner.temp }}/core-result.json
        run: |
          .agents/ksf runtime verify --json
          ksf_node=$(.agents/ksf hello --json | /usr/bin/plutil -extract runtime.nodePath raw -o - -)
          "$ksf_node" .agents/core/runtime/src/distribution/release-actions.js inspect
          if ! .agents/ksf release publish "$KSF_RELEASE_DIRECTORY" --json > "$KSF_RELEASE_RESULT"; then
            cat "$KSF_RELEASE_RESULT"
            printf 'Core publication failed or is unknown. Reconcile this same version and artifact before retrying.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          "$ksf_node" .agents/core/runtime/src/distribution/release-actions.js report
