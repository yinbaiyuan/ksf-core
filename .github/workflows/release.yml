name: Publish ksf-core Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: ksf-release
  cancel-in-progress: false
jobs:
  find-proof:
    uses: ./.github/workflows/proof.yml
  verification:
    needs: find-proof
    if: github.repository == 'yinbaiyuan/ksf-core' && needs.find-proof.outputs.valid != 'true'
    uses: ./.github/workflows/verification.yml
    with:
      full: true
  prepare:
    if: ${{ !cancelled() && github.repository == 'yinbaiyuan/ksf-core' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      version: ${{ steps.bundle.outputs.version }}
      revision: ${{ steps.bundle.outputs.revision }}
      index: ${{ steps.bundle.outputs.index_sha256 }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source and prepare bundled runtime
        env:
          KSF_RELEASE_DIRECTORY: ${{ runner.temp }}/ksf-release
          KSF_REF_TYPE: ${{ github.ref_type }}
          KSF_REF_NAME: ${{ github.ref_name }}
        run: |
          ksf_version=$(python3 -c 'import json; print(json.load(open(".agents/core/build.json"))["version"])')
          if [ "$KSF_REF_TYPE" = tag ]; then test "$KSF_REF_NAME" = "v$ksf_version"; fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/core-main
          .agents/ksf build --json > /dev/null
          .agents/ksf runtime verify --json
          ksf_node=$(.agents/ksf hello --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["runtime"]["nodePath"])')
          printf 'KSF_RELEASE_NODE=%s\n' "$ksf_node" >> "$GITHUB_ENV"
          dirname "$ksf_node" >> "$GITHUB_PATH"
      - name: Locate pinned npm cache
        id: npm-cache
        run: |
          ksf_cache=$(npm config get cache)
          ksf_cache=${ksf_cache%$'\r'}
          test -n "$ksf_cache"
          printf 'path=%s\n' "$ksf_cache" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.npm-cache.outputs.path }}
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - name: Install locked release dependencies
        run: |
          npm --prefix .agents/core/applications/sdk ci --prefer-offline --ignore-scripts > sdk.install.log 2>&1 & ksf_sdk_pid=$!
          npm --prefix .agents/core/runtime/web ci --prefer-offline > web.install.log 2>&1 & ksf_web_pid=$!
          ksf_install_status=0
          for ksf_pid in "$ksf_sdk_pid" "$ksf_web_pid"; do
            wait "$ksf_pid" || ksf_install_status=$?
          done
          cat sdk.install.log web.install.log
          exit "$ksf_install_status"
      - name: Build frontend for the final artifact
        working-directory: .agents/core/runtime/web
        run: npm run build
      - name: Build the single Core bundle
        id: bundle
        env:
          KSF_RELEASE_DIRECTORY: ${{ runner.temp }}/ksf-release
          KSF_EXPECTED_REVISION: ${{ github.sha }}
          KSF_GITHUB_TOKEN: ${{ github.token }}
        run: |
          .agents/ksf release build --output "$KSF_RELEASE_DIRECTORY" --json
          "$KSF_RELEASE_NODE" .agents/core/runtime/src/distribution/release-actions.js inspect
      - name: Verify official Core template settings
        env:
          KSF_GITHUB_TOKEN: ${{ github.token }}
        run: '"$KSF_RELEASE_NODE" .agents/core/runtime/src/distribution/release-actions.js preflight'
      - uses: actions/upload-artifact@v7.0.2
        id: upload
        with:
          name: ksf-core-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ksf-release/*.tar.gz
            ${{ runner.temp }}/ksf-release/*.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  warm-windows-downloads:
    needs: find-proof
    if: ${{ !cancelled() && github.repository == 'yinbaiyuan/ksf-core' && github.ref == 'refs/heads/core-main' && needs.find-proof.outputs.valid == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Prepare verified Windows runtime for download cache
        shell: powershell
        run: |
          & ./.agents/ksf.ps1 build --json | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./.agents/ksf.ps1 runtime verify --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $details = & ./.agents/ksf.ps1 hello --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Split-Path $details.runtime.nodePath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Locate pinned npm cache
        id: npm-cache
        run: |
          ksf_cache=$(npm config get cache)
          ksf_cache=${ksf_cache%$'\r'}
          test -n "$ksf_cache"
          printf 'path=%s\n' "$ksf_cache" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        id: npm-downloads
        with:
          path: ${{ steps.npm-cache.outputs.path }}
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - name: Populate missing default-branch Windows downloads
        if: steps.npm-downloads.outputs.cache-hit != 'true'
        run: |
          npm --prefix .agents/core/applications/sdk ci --prefer-offline --ignore-scripts > sdk.install.log 2>&1 & ksf_sdk_pid=$!
          npm --prefix .agents/core/runtime/web ci --prefer-offline > web.install.log 2>&1 & ksf_web_pid=$!
          npm --prefix .agents/core/applications/projects ci --prefer-offline --ignore-scripts > projects.install.log 2>&1 & ksf_projects_pid=$!
          ksf_install_status=0
          for ksf_pid in "$ksf_sdk_pid" "$ksf_web_pid" "$ksf_projects_pid"; do
            wait "$ksf_pid" || ksf_install_status=$?
          done
          cat sdk.install.log web.install.log projects.install.log
          exit "$ksf_install_status"
  release:
    needs: [find-proof, verification, prepare]
    if: ${{ !cancelled() && github.repository == 'yinbaiyuan/ksf-core' && needs.prepare.result == 'success' && (needs.find-proof.outputs.valid == 'true' || needs.verification.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      KSF_EXPECTED_REVISION: ${{ needs.prepare.outputs.revision }}
      KSF_EXPECTED_INDEX: ${{ needs.prepare.outputs.index }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact }}
          path: ${{ runner.temp }}/ksf-release
          merge-multiple: true
      - name: Verify frozen handoff and publish only Core
        env:
          KSF_GITHUB_TOKEN: ${{ github.token }}
          KSF_RELEASE_DIRECTORY: ${{ runner.temp }}/ksf-release
          KSF_RELEASE_PHASE: core
          KSF_RELEASE_RESULT: ${{ runner.temp }}/core-result.json
        run: |
          .agents/ksf runtime verify --json
          ksf_node=$(.agents/ksf hello --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["runtime"]["nodePath"])')
          "$ksf_node" .agents/core/runtime/src/distribution/release-actions.js inspect
          .agents/ksf release publish "$KSF_RELEASE_DIRECTORY" --dry-run --json
          if ! .agents/ksf release publish "$KSF_RELEASE_DIRECTORY" --json > "$KSF_RELEASE_RESULT"; then
            cat "$KSF_RELEASE_RESULT"
            printf 'Core publication failed or is unknown. Reconcile this same version and artifact before retrying.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          "$ksf_node" .agents/core/runtime/src/distribution/release-actions.js report
