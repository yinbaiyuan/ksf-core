name: Prepare one platform
on:
  workflow_call:
    inputs:
      prepared:
        type: string
        required: true
      os:
        type: string
        required: true
      groups:
        type: string
        default: ''
      base:
        type: string
        default: ''
      toolchains:
        type: boolean
        default: true
      full:
        type: boolean
        default: false
permissions:
  contents: read
env:
  KSF_SKIP_AUTO_UPDATE: '1'
  KSF_TEST_BASE: ${{ inputs.base }}
jobs:
  prepare:
    name: Prepare ${{ inputs.prepared }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Prepare and verify pinned runtime on macOS
        if: runner.os == 'macOS'
        run: |
          .agents/ksf build --json > /dev/null
          .agents/ksf runtime verify --json
          ksf_node=$(.agents/ksf hello --json | /usr/bin/plutil -extract runtime.nodePath raw -o - -)
          dirname "$ksf_node" >> "$GITHUB_PATH"
      - name: Prepare and verify pinned runtime on Linux
        if: runner.os == 'Linux'
        run: |
          .agents/ksf build --json > /dev/null
          .agents/ksf runtime verify --json
          ksf_node=$(.agents/ksf hello --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["runtime"]["nodePath"])')
          dirname "$ksf_node" >> "$GITHUB_PATH"
      - name: Prepare and verify pinned runtime on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & ./.agents/ksf.ps1 build --json | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./.agents/ksf.ps1 runtime verify --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $details = & ./.agents/ksf.ps1 hello --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Split-Path $details.runtime.nodePath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Select exact preparation groups
        env:
          KSF_PREPARED: ${{ inputs.prepared }}
          KSF_PREPARATION_OS: ${{ inputs.os }}
          KSF_PREPARATION_TOOLCHAINS: ${{ inputs.toolchains }}
          KSF_PREPARATION_FULL: ${{ inputs.full }}
          KSF_PREPARATION_GROUPS: ${{ inputs.groups }}
        run: node .agents/core/runtime/src/testing/ci.js prepare-groups
      - name: Locate pinned npm cache
        if: inputs.toolchains
        id: npm-cache
        run: |
          ksf_cache=$(npm config get cache)
          ksf_cache=${ksf_cache%$'\r'}
          test -n "$ksf_cache"
          printf 'path=%s\n' "$ksf_cache" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        if: inputs.toolchains
        with:
          path: ${{ steps.npm-cache.outputs.path }}
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - name: Install locked platform dependencies
        if: inputs.toolchains
        run: |
          node .agents/core/runtime/src/testing/prepare-ci-fixtures.js > fixtures.prepare.log 2>&1 & ksf_fixtures_pid=$!
          npm --prefix .agents/core/applications/sdk ci --prefer-offline --ignore-scripts > sdk.install.log 2>&1 & ksf_sdk_pid=$!
          npm --prefix .agents/core/runtime/web ci --prefer-offline > web.install.log 2>&1 & ksf_web_pid=$!
          npm --prefix .agents/core/applications/projects ci --prefer-offline --ignore-scripts > projects.install.log 2>&1 & ksf_projects_pid=$!
          ksf_install_status=0
          for ksf_pid in "$ksf_sdk_pid" "$ksf_web_pid" "$ksf_projects_pid" "$ksf_fixtures_pid"; do
            wait "$ksf_pid" || ksf_install_status=$?
          done
          cat sdk.install.log web.install.log projects.install.log fixtures.prepare.log
          exit "$ksf_install_status"
      - name: Prepare runtime-only native fixtures
        if: ${{ !inputs.toolchains }}
        run: node .agents/core/runtime/src/testing/prepare-ci-fixtures.js
      - name: Build frontend before server tests
        if: inputs.toolchains
        working-directory: .agents/core/runtime/web
        run: npm run build
      - name: Freeze prepared toolchains
        if: inputs.toolchains
        env:
          COPYFILE_DISABLE: '1'
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            tar -cf prepared.tar .agents/core/applications/sdk/node_modules .agents/core/applications/projects/node_modules .agents/core/runtime/web/node_modules .agents/core/runtime/web/dist .agents/runtime-data/ci-seeds
            node .agents/core/runtime/src/testing/prepared-archive.js compress prepared.tar prepared.tar.zst
          else
            tar -cf - .agents/core/applications/sdk/node_modules .agents/core/applications/projects/node_modules .agents/core/runtime/web/node_modules .agents/core/runtime/web/dist .agents/runtime-data/ci-seeds | node .agents/core/runtime/src/testing/prepared-archive.js compress - prepared.tar.zst
          fi
      - name: Freeze prepared runtime fixtures
        if: ${{ !inputs.toolchains }}
        env:
          COPYFILE_DISABLE: '1'
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            tar -cf prepared.tar .agents/runtime-data/ci-seeds
            node .agents/core/runtime/src/testing/prepared-archive.js compress prepared.tar prepared.tar.zst
          else
            tar -cf - .agents/runtime-data/ci-seeds | node .agents/core/runtime/src/testing/prepared-archive.js compress - prepared.tar.zst
          fi
      - uses: actions/upload-artifact@v7.0.2
        with:
          overwrite: true
          name: prepared-${{ inputs.prepared }}
          path: prepared.tar.zst
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          overwrite: true
          name: failure-platform-${{ inputs.prepared }}-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            *.report.json
            .agents/runtime-data/tests/
